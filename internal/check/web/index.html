<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Intelligence Check</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24312c;background:#f3f5f4;font-size:14px}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #ccd5d0;padding:20px 24px;display:flex;align-items:center;gap:20px}h1{font-size:20px;margin:0}main{max-width:1100px;margin:auto;padding:24px}section{margin-bottom:30px}h2{font-size:16px}input,select,button{font:inherit;min-height:36px;border:1px solid #b8c5be;border-radius:4px;padding:7px 10px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e4eee8}button:disabled{opacity:.5}input{min-width:0;width:100%}label{display:grid;gap:6px}.fields{display:grid;grid-template-columns:2fr 2fr;gap:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.row input{flex:1;min-width:170px}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:12px;border-bottom:1px solid #dce3df;overflow-wrap:anywhere}th{font-weight:500;color:#526359}td:last-child{min-width:200px}.scroll{overflow:auto}.status{color:#19774c}.warning{color:#a32f40}#message{min-height:24px;color:#a32f40}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:16px;border:1px solid #dce3df;max-height:480px;overflow:auto}summary{cursor:pointer;padding:10px 0}a{color:#19774c}small{color:#65746b}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #19774c;outline-offset:2px}@media(max-width:640px){main{padding:16px}.fields{grid-template-columns:1fr}header{padding:16px}th,td{padding:9px}}
</style>
<style>@media(max-width:640px){header{flex-wrap:wrap}header h1{flex:1;min-width:210px}table{min-width:650px}th,td{word-break:normal}.scroll{max-width:100%}}</style>
<style>#traceResults table{min-width:0;table-layout:fixed}#traceResults th:first-child{width:56%}#traceResults th:nth-child(2){width:20%}#traceResults td:last-child{min-width:0}#traceResults td{overflow-wrap:anywhere}</style>
<header><h1>Intelligence Check</h1><span id="health"></span><button id="closeRemote">结束远程访问</button></header>
<main><div id="message" role="alert"></div>
<section><h2>主力模型</h2><form id="target" class="row"><input name="model" list="catalog" aria-label="完整模型 ID" placeholder="provider/model" required><datalist id="catalog"></datalist><button type="button" id="loadModels">刷新模型</button><button>添加监测目标</button></form><div class="scroll"><table><thead><tr><th>模型</th><th>状态</th><th>最近通过</th><th>操作</th></tr></thead><tbody id="targets"></tbody></table></div></section>
<section><details><summary>Magpie 连接与预算</summary><form id="config"><div class="fields"><label>网关 URL<input name="gateway_url" placeholder="http://127.0.0.1:8080" required></label><label>网关 Key<input name="gateway_key" type="password" autocomplete="new-password" placeholder="留空保留已保存 Key"></label><label>Magpie 日志路径<input name="log_path"></label><label>每日每模型请求上限<input name="daily_limit" type="number" min="1" max="10000" value="120"></label></div><div class="row"><button>保存设置</button><small id="logHealth"></small></div></form></details></section>
<section><h2>测试题库</h2><div class="row"><select id="prompt" aria-label="测试题"></select><select id="model" aria-label="测试模型"></select><button id="run">运行所选题目</button></div><details><summary>提示词原文</summary><pre id="promptText"></pre></details><details><summary>结果参考与限制</summary><p id="guidance"></p></details></section>
<section><h2>ModelTrace 模型指纹</h2><div class="row"><select id="traceModel" aria-label="指纹检测模型"></select><button id="traceRun">运行三条指纹挑战</button></div><p><small>概率仅表示当前候选库内的相似程度，不证明模型身份；指纹结果不改变门禁。</small></p><div id="traceResults" aria-live="polite"></div></section>
<section><h2>检测记录</h2><div id="results"></div></section></main>
<script type="module">
import { renderModelTrace, runModelTrace } from '/modeltrace/panel.js';
let data;const $=s=>document.querySelector(s);const names={unverified:'未检测',checking:'检测中',passed:'通过',review:'需要人工确认',unavailable:'检测不可用',manual:'待人工评价',failed:'未通过',running:'进行中'};
function text(tag,value){const el=document.createElement(tag);el.textContent=value;return el}
async function request(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});if(!r.ok){if(r.status===401)throw Error('管理会话已失效，请从 Magpie 插件重新打开控制台。');if(r.status>=500)throw Error(`控制台连接暂时不可用（HTTP ${r.status}），请稍后重试；持续失败请从插件重新打开远程入口。`);const message=await r.text();throw Error(/<!doctype|<html/i.test(message)?`请求失败（HTTP ${r.status}）`:message)}return r.json()}
async function action(model,action,prompt){try{await request('/api/action',{model,action,prompt});await refresh()}catch(e){$('#message').textContent=e.message}}
async function refresh(){try{data=await request('/api/state');$('#health').textContent=data.health||'服务运行中';$('#health').className=data.health?'warning':'status';$('#logHealth').textContent=data.log_health+(Date.parse(data.last_activity)>0?' / 最近触发 '+new Date(data.last_activity).toLocaleString():' / 尚未收到调用触发');
const cfg=data.state.config;for(const k of ['gateway_url','log_path','daily_limit']){const el=$('#config').elements[k];if(document.activeElement!==el)el.value=cfg[k]}
$('#targets').replaceChildren();const selected=$('#model').value;$('#model').replaceChildren();for(const t of Object.values(data.state.targets)){const tr=document.createElement('tr');tr.append(text('td',t.model),text('td',t.enabled?(names[t.state]||t.state)+(Date.parse(t.allow_until)>Date.now()?' / 限时放行':''):'监测关闭'),text('td',Date.parse(t.checked_at)>0?new Date(t.checked_at).toLocaleString():'未通过'));const td=document.createElement('td');for(const [label,a]of [['重新检测','test'],['放行 15 分钟','allow'],['暂停','hold'],['关闭监测','disable']]){const b=text('button',label);b.onclick=()=>action(t.model,a);td.append(b,' ')}tr.append(td);$('#targets').append(tr);if(t.enabled){const o=text('option',t.model);o.value=t.model;$('#model').append(o)}}$('#model').value=selected||$('#model').options[0]?.value||'';
if(!$('#prompt').options.length){for(const p of data.prompts){const o=text('option',p.name);o.value=p.id;$('#prompt').append(o)}}showPrompt();renderModelTrace(data);$('#results').replaceChildren();for(const r of [...(data.state.results||[])].reverse().slice(0,50)){const d=document.createElement('details');const download=text('a','下载原始回答');download.href='/api/results/'+encodeURIComponent(r.id)+'/download';d.append(text('summary',`${new Date(r.time).toLocaleString()}  ${r.model}  ${names[r.verdict]||r.verdict}  ${r.tokens||0} tokens`),text('pre',r.error||r.answer||'等待回答'),download);if(r.prompt_text)d.append(text('pre',r.prompt_text));$('#results').append(d)}$('#message').textContent='';
}catch(e){$('#message').textContent=e.message}}
function showPrompt(){$('#promptText').textContent=data?.prompts.find(p=>p.id===$('#prompt').value)?.text||'';$('#guidance').textContent=data?.guidance?.[$('#prompt').value]||''}
$('#closeRemote').onclick=async()=>{try{await request('/api/console/close',{});$('#message').textContent='远程访问已结束，请从插件重新打开';}catch(e){$('#message').textContent=e.message}};
$('#loadModels').onclick=async()=>{try{const models=await request('/api/models');$('#catalog').replaceChildren();for(const m of models){const o=text('option',m.group);o.value=m.id;$('#catalog').append(o)}$('#message').textContent=`已读取 ${models.length} 个模型`;}catch(e){$('#message').textContent=e.message}};
$('#prompt').onchange=showPrompt;$('#run').onclick=()=>action($('#model').value,'test',$('#prompt').value);
$('#traceRun').onclick=async()=>{try{await runModelTrace(request);await refresh()}catch(e){$('#message').textContent=e.message}};
$('#config').onsubmit=async e=>{e.preventDefault();const c=Object.fromEntries(new FormData(e.target));c.daily_limit=Number(c.daily_limit);try{await request('/api/config',c);e.target.elements.gateway_key.value='';$('#message').textContent='设置已保存';refresh()}catch(e){$('#message').textContent=e.message}};
$('#target').onsubmit=async e=>{e.preventDefault();try{await request('/api/target',{model:e.target.elements.model.value.trim(),enabled:true});e.target.reset();refresh()}catch(e){$('#message').textContent=e.message}};refresh();setInterval(refresh,3000);
</script></html>
